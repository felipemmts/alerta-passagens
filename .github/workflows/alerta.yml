name: Alerta de passagens

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3). As tarifas novas chegam aos sistemas de
    # reserva em lotes (por volta de 10h, 13h, 16h e 20h de Nova York) e levam 1 h ou
    # mais para aparecer: 4 execuções ficam logo depois de cada lote, mais 2 no meio.
    - cron: "13 2,16,19,22 * * *"  # 23h13, 13h13, 16h13 e 19h13 em Brasília
    - cron: "43 6,11 * * *"        # 3h43 e 8h43 em Brasília
  workflow_dispatch:
    inputs:
      resumo:
        description: "Buscar e mandar e-mail com os preços atuais, mesmo acima do alvo"
        type: boolean
        default: false
      teste_email:
        description: "Só enviar um e-mail de teste (sem buscar preços)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alerta-passagens
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-24.04  # fixo: a instalação do navegador (Playwright) falha no Ubuntu 26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verificar preços
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          TESTE_EMAIL: ${{ inputs.teste_email }}
          RESUMO: ${{ inputs.resumo }}
          PRAZO_MINUTOS: "20"  # para de buscar e envia o que tem antes do timeout do job
          USAR_NAVEGADOR: "true"
          LOTE: "20"  # combinações por execução; a próxima continua de onde esta parou
          PAUSA_SEGUNDOS: "20"      # pausa aleatória entre 20 e 45 s entre buscas:
          PAUSA_MAX_SEGUNDOS: "45"  # ritmo de pessoa, para o Google não travar
        shell: bash  # usa pipefail: o passo falha se o script falhar
        run: python -u alerta.py 2>&1 | tee ultima_execucao.log

      - name: Guardar páginas de diagnóstico
        if: always() && hashFiles('debug/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: debug/
          retention-days: 7

      - name: Salvar histórico e consultas
        if: always()
        run: |
          if git diff --quiet -- historico.json consultas.json progresso.json ultima_execucao.log && git ls-files --error-unmatch ultima_execucao.log >/dev/null 2>&1; then
            echo "Histórico sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch progresso.json
          git add historico.json consultas.json progresso.json ultima_execucao.log
          git commit -m "Atualiza histórico e consultas de preços [skip ci]"
          # os dois alertas podem commitar ao mesmo tempo: tenta de novo se o push for recusado
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
