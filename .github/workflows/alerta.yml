name: Alerta de passagens GRU → Espanha

on:
  schedule:
    - cron: "17 0,8,16 * * *"  # 3x/dia (UTC) = 21h17, 5h17 e 13h17 em Brasília (fora da hora cheia, que o GitHub atrasa ou descarta)
  workflow_dispatch:
    inputs:
      resumo:
        description: "Buscar e mandar e-mail com os preços atuais, mesmo acima do alvo"
        type: boolean
        default: false
      teste_email:
        description: "Só enviar um e-mail de teste (sem buscar preços)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alerta-passagens
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar preços
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          TESTE_EMAIL: ${{ inputs.teste_email }}
          RESUMO: ${{ inputs.resumo }}
          PRAZO_MINUTOS: "22"  # para de buscar e envia o que tem antes do timeout do job
        shell: bash  # usa pipefail: o passo falha se o script falhar
        run: python -u alerta.py 2>&1 | tee ultima_execucao.log

      - name: Guardar páginas de diagnóstico
        if: always() && hashFiles('debug/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: debug/
          retention-days: 7

      - name: Salvar histórico e consultas
        if: always()
        run: |
          if git diff --quiet -- historico.json consultas.json ultima_execucao.log && git ls-files --error-unmatch ultima_execucao.log >/dev/null 2>&1; then
            echo "Histórico sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.json consultas.json ultima_execucao.log
          git commit -m "Atualiza histórico e consultas de preços [skip ci]"
          # os dois alertas podem commitar ao mesmo tempo: tenta de novo se o push for recusado
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
