name: Alerta de passagens

on:
  schedule:
    - cron: "0 */6 * * *"  # a cada 6 horas (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alerta-passagens
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar preços
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python alerta.py

      - name: Salvar histórico e consultas
        if: always()
        run: |
          if git diff --quiet -- historico.json consultas.json; then
            echo "Histórico sem alterações."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.json consultas.json
          git commit -m "Atualiza histórico e consultas de preços [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
