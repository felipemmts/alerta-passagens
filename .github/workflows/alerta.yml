name: Alerta de passagens

on:
  schedule:
    # Cada execução fica ~5h50 buscando em rodadas espaçadas. O agendamento a cada
    # 3 h só garante que a próxima comece logo que a anterior acabar (o GitHub
    # atrasa e descarta agendamentos frequentes, então não dá para depender dele).
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      resumo:
        description: "Buscar e mandar e-mail com os preços atuais, mesmo acima do alvo (uma rodada só)"
        type: boolean
        default: false
      teste_email:
        description: "Só enviar um e-mail de teste (sem buscar preços)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alerta-passagens
  cancel-in-progress: false  # a próxima espera a atual terminar

jobs:
  verificar:
    runs-on: ubuntu-24.04  # fixo: a instalação do navegador (Playwright) falha no Ubuntu 26
    timeout-minutes: 355   # o máximo do GitHub é 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Buscar preços em rodadas
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          TESTE_EMAIL: ${{ inputs.teste_email }}
          RESUMO: ${{ inputs.resumo }}
          PRAZO_MINUTOS: "15"        # limite de cada rodada
          USAR_NAVEGADOR: "true"
          LOTE: "5"                  # combinações por rodada; a próxima continua de onde esta parou
          PAUSA_SEGUNDOS: "60"       # pausa aleatória de 1 a 2 min entre buscas:
          PAUSA_MAX_SEGUNDOS: "120"  # ritmo de pessoa, para o Google não travar
        shell: bash
        run: |
          # Botões manuais (resumo / teste de e-mail): uma rodada só.
          if [ "${RESUMO}" = "true" ] || [ "${TESTE_EMAIL}" = "true" ]; then
            python -u alerta.py 2>&1 | tee ultima_execucao.log || true
            ./salvar.sh || true
            exit 0
          fi
          fim=$((SECONDS + 330 * 60))   # ~5h30 de rodadas
          rodada=0
          while [ $SECONDS -lt $fim ]; do
            rodada=$((rodada + 1))
            echo "::group::Rodada $rodada ($(date -u +%H:%M) UTC)"
            python -u alerta.py 2>&1 | tee ultima_execucao.log || echo "rodada $rodada terminou com erro"
            ./salvar.sh || true
            echo "::endgroup::"
            # intervalo aleatório de 15 a 25 min até a próxima rodada
            espera=$((900 + RANDOM % 600))
            [ $((SECONDS + espera)) -lt $fim ] || break
            sleep $espera
          done

      - name: Guardar páginas de diagnóstico
        if: always() && hashFiles('debug/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: debug/
          retention-days: 7

      - name: Salvar histórico e consultas
        if: always()
        run: ./salvar.sh
